name: Android CI

# Build 0: the fork adds its own build-and-test workflow — upstream has no
# CI at all (.github holds only dependabot.yml). A push to main builds the
# debug APK, runs the unit tests (including the Robolectric startup gate),
# and runs the permanent guards (255-register dex guard). A red build stops
# the line: fix it and verify green before pushing anything new.
#
# No release job here — the release workflow (tag push, signed APK attached
# by the workflow itself) lands in Phase 1.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up JDK 25 (Gradle daemon JVM)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
        # gradle/gradle-daemon-jvm.properties (upstream, generated by
        # :updateDaemonJvm) pins the daemon JVM to Temurin 25. The code
        # itself still targets Java 21 (sourceCompatibility 21,
        # Kotlin jvmTarget 21), so both JDKs are installed and handed to
        # Gradle via org.gradle.java.installations.paths — no foojay
        # download at build time.

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses || true
          yes | "$SDKMANAGER" "platforms;android-37" "build-tools;35.0.0" "build-tools;36.0.0" "build-tools;37.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Write placeholder local.properties
        run: |
          set -euo pipefail
          # The release signing config in app/build.gradle.kts reads
          # BUNDLE_* from local.properties at configuration time, so a
          # build without the file fails before it starts — even a debug
          # build. CI has no release keystore (Phase 1), so this file
          # carries placeholders; the release config is never used by a
          # debug build.
          cat > local.properties <<'EOF'
          BUNDLE_STORE_FILE=CANNOT BUILD
          BUNDLE_KEY_ALIAS=CANNOT BUILD
          BUNDLE_KEY_PASSWD=CANNOT BUILD
          BUNDLE_STORE_PASSWD=CANNOT BUILD
          EOF

      - name: Run unit tests (incl. Robolectric startup gate)
        run: ./gradlew :app:testDebugUnitTest --stacktrace -Porg.gradle.java.installations.paths="$JAVA_HOME_21_X64,$JAVA_HOME_25_X64"

      - name: Upload unit-test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace -Porg.gradle.java.installations.paths="$JAVA_HOME_21_X64,$JAVA_HOME_25_X64"

      - name: Verify no app method exceeds 255 registers (dex guard)
        run: |
          set -euo pipefail
          # HowlingDog v1.3.0: a composable grew past 256 registers,
          # so the $changed parameter sat at v263 and d8 truncated
          # it to v7 in the prologue's 8-bit-field instructions.
          # ART rejected the class at launch (VerifyError) while the
          # JVM (Robolectric) stayed green — CI never saw it. This
          # guard fails the build if any app method crosses the
          # limit again, so the next oversized composable is split
          # before it ships instead of after. It lives here from
          # Build 0, permanently; never remove it to get a build
          # green.
          DEXDUMP=$(ls "$ANDROID_HOME/build-tools/"*/dexdump | sort -V | tail -1)
          export DEXDUMP
          rm -rf /tmp/dexcheck && mkdir -p /tmp/dexcheck
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          unzip -o -q "$APK" 'classes*.dex' -d /tmp/dexcheck
          python3 - <<'PYEOF'
          import glob, re, subprocess, sys
          import os
          dexdump = os.environ['DEXDUMP']
          worst = []
          for dex in sorted(glob.glob('/tmp/dexcheck/classes*.dex')):
              out = subprocess.run([dexdump, '-d', dex], capture_output=True,
                                   text=True, errors='replace').stdout
              cls = name = typ = None
              for ln in out.splitlines():
                  m = re.match(r"\s*Class descriptor\s*: '(.*);'", ln)
                  if m:
                      cls = m.group(1); continue
                  m = re.match(r"\s*name\s*: '(.*)'", ln)
                  if m:
                      name = m.group(1); continue
                  m = re.match(r"\s*type\s*: '(.*)'", ln)
                  if m:
                      typ = m.group(1); continue
                  m = re.match(r"\s*registers\s*: (\d+)", ln)
                  if m and cls and cls.startswith('Lcom/pyamsoft/tetherfi/'):
                      worst.append((int(m.group(1)), cls, name, typ))
          worst.sort(reverse=True)
          print('largest app methods by register count:')
          for n, c, nm, t in worst[:8]:
              print(f'  {n} {c} {nm}{t}')
          bad = [w for w in worst if w[0] > 255]
          if bad:
              print('FAIL: methods over the 255-register limit:')
              for n, c, nm, t in bad:
                  print(f'  {n} {c} {nm}{t}')
              sys.exit(1)
          print('dex register guard OK')
          PYEOF

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: backhaul-apk-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
