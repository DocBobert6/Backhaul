name: Android CI

# Build 0: the fork adds its own build-and-test workflow — upstream has no
# CI at all (.github holds only dependabot.yml). A push to main builds the
# debug APK, runs the unit tests (including the Robolectric startup gate),
# and runs the permanent guards (255-register dex guard). A red build stops
# the line: fix it and verify green before pushing anything new.
#
# Phase 1: a push of a v* tag additionally builds the release APK and
# uploads it as the backhaul-apk-release artifact. A second job
# (release, needs: build) then creates the GitHub release for the tag
# and attaches the release APK to it, using the workflow's own
# GITHUB_TOKEN — the release asset upload MUST happen here, inside
# Actions: uploading from outside returns 401 on uploads.github.com.
# The release job only runs after the build job, so the release is
# never created from an unverified build. (Poing alpha.2 pattern.)
# Release signing: the keystore arrives base64-encoded in the
# BUNDLE_KEYSTORE_BASE64 secret and is restored into app/ by the
# "Restore release keystore" step on tag builds; local.properties is
# then rewritten with the real BUNDLE_* values from secrets. The
# placeholder local.properties below only covers non-tag builds,
# which never use the release signing config.

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up JDK 25 (Gradle daemon JVM)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
        # gradle/gradle-daemon-jvm.properties (upstream, generated by
        # :updateDaemonJvm) pins the daemon JVM to Temurin 25. The code
        # itself still targets Java 21 (sourceCompatibility 21,
        # Kotlin jvmTarget 21), so both JDKs are installed and handed to
        # Gradle via org.gradle.java.installations.paths — no foojay
        # download at build time.

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          # Licences first (guarded: yes dies on SIGPIPE once sdkmanager
          # exits, and under pipefail that would fail the step even when
          # sdkmanager itself succeeded -- that is what killed run 2,
          # whose install reached 100% "Computing updates" with no
          # package warning before exiting 1).
          yes | "$SDKMANAGER" --licenses || true
          echo "--- preinstalled platforms:"
          ls "$ANDROID_HOME/platforms/" || true
          # Stable-channel packages. stdin is /dev/null (licences are
          # already accepted above), so no yes-pipe can fail the step;
          # --verbose so a failure names the package.
          "$SDKMANAGER" --verbose "build-tools;35.0.0" "build-tools;36.0.0" "build-tools;37.0.0" "platform-tools" < /dev/null
          # API 37 platform: the runner preinstalls it under MINOR
          # version directories (android-37.0 / 37.1 / 37.2, plus beta
          # variants) -- there is no bare android-37 directory, and no
          # sdkmanager channel (stable/beta/dev/canary, all tried in
          # run 3) offers a package named platforms;android-37. So a
          # preinstalled android-37.* directory satisfies the
          # requirement; only if none exists do we try installing one.
          if ! ls -d "$ANDROID_HOME/platforms/android-37"* >/dev/null 2>&1; then
            for pkg in "platforms;android-37" "platforms;android-37.0"; do
              for ch in 1 2 3; do
                echo "--- trying sdkmanager channel $ch for $pkg"
                "$SDKMANAGER" --verbose --channel="$ch" "$pkg" < /dev/null || true
                if ls -d "$ANDROID_HOME/platforms/android-37"* >/dev/null 2>&1; then
                  echo "--- API 37 platform installed via channel $ch ($pkg)"
                  break 2
                fi
              done
            done
          fi
          ls -d "$ANDROID_HOME/platforms/android-37"* >/dev/null 2>&1 || { echo "FATAL: no android-37 platform directory (stable repo has none; preview channels 1/2/3 offer no platforms;android-37 or platforms;android-37.0)"; exit 1; }
          echo "--- API 37 platform directories present:"
          ls -d "$ANDROID_HOME/platforms/android-37"* || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Write placeholder local.properties
        run: |
          set -euo pipefail
          # The release signing config in app/build.gradle.kts reads
          # BUNDLE_* from local.properties at configuration time, so a
          # build without the file fails before it starts — even a debug
          # build. On non-tag builds this file carries placeholders;
          # the release config is never used by a debug build. On tag
          # builds the "Restore release keystore" step below rewrites
          # it with the real values before assembleRelease runs.
          cat > local.properties <<'EOF'
          BUNDLE_STORE_FILE=CANNOT BUILD
          BUNDLE_KEY_ALIAS=CANNOT BUILD
          BUNDLE_KEY_PASSWD=CANNOT BUILD
          BUNDLE_STORE_PASSWD=CANNOT BUILD
          EOF

      - name: Run unit tests (incl. Robolectric startup gate)
        run: ./gradlew :app:testDebugUnitTest --stacktrace -Porg.gradle.java.installations.paths="$JAVA_HOME_21_X64,$JAVA_HOME_25_X64"

      - name: Upload unit-test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace -Porg.gradle.java.installations.paths="$JAVA_HOME_21_X64,$JAVA_HOME_25_X64"

      - name: Verify no app method exceeds 255 registers (dex guard)
        run: |
          set -euo pipefail
          # HowlingDog v1.3.0: a composable grew past 256 registers,
          # so the $changed parameter sat at v263 and d8 truncated
          # it to v7 in the prologue's 8-bit-field instructions.
          # ART rejected the class at launch (VerifyError) while the
          # JVM (Robolectric) stayed green — CI never saw it. This
          # guard fails the build if any app method crosses the
          # limit again, so the next oversized composable is split
          # before it ships instead of after. It lives here from
          # Build 0, permanently; never remove it to get a build
          # green.
          DEXDUMP=$(ls "$ANDROID_HOME/build-tools/"*/dexdump | sort -V | tail -1)
          export DEXDUMP
          rm -rf /tmp/dexcheck && mkdir -p /tmp/dexcheck
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          unzip -o -q "$APK" 'classes*.dex' -d /tmp/dexcheck
          python3 - <<'PYEOF'
          import glob, re, subprocess, sys
          import os
          dexdump = os.environ['DEXDUMP']
          worst = []
          for dex in sorted(glob.glob('/tmp/dexcheck/classes*.dex')):
              out = subprocess.run([dexdump, '-d', dex], capture_output=True,
                                   text=True, errors='replace').stdout
              cls = name = typ = None
              for ln in out.splitlines():
                  m = re.match(r"\s*Class descriptor\s*: '(.*);'", ln)
                  if m:
                      cls = m.group(1); continue
                  m = re.match(r"\s*name\s*: '(.*)'", ln)
                  if m:
                      name = m.group(1); continue
                  m = re.match(r"\s*type\s*: '(.*)'", ln)
                  if m:
                      typ = m.group(1); continue
                  m = re.match(r"\s*registers\s*: (\d+)", ln)
                  if m and cls and cls.startswith('Lcom/pyamsoft/tetherfi/'):
                      worst.append((int(m.group(1)), cls, name, typ))
          worst.sort(reverse=True)
          print('largest app methods by register count:')
          for n, c, nm, t in worst[:8]:
              print(f'  {n} {c} {nm}{t}')
          bad = [w for w in worst if w[0] > 255]
          if bad:
              print('FAIL: methods over the 255-register limit:')
              for n, c, nm, t in bad:
                  print(f'  {n} {c} {nm}{t}')
              sys.exit(1)
          print('dex register guard OK')
          PYEOF

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: backhaul-apk-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Restore release keystore (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          # The keystore itself is never in the repo: it arrives
          # base64-encoded in the BUNDLE_KEYSTORE_BASE64 secret and
          # is written into app/, where the release signing config
          # finds it through local.properties (see
          # app/build.gradle.kts). The runner is wiped after the run.
          echo "$BUNDLE_KEYSTORE_BASE64" | base64 -d > app/backhaul-release.keystore
          cat > local.properties <<EOF
          BUNDLE_STORE_FILE=$BUNDLE_STORE_FILE
          BUNDLE_KEY_ALIAS=$BUNDLE_KEY_ALIAS
          BUNDLE_KEY_PASSWD=$BUNDLE_KEY_PASSWD
          BUNDLE_STORE_PASSWD=$BUNDLE_STORE_PASSWD
          EOF
        env:
          BUNDLE_KEYSTORE_BASE64: ${{ secrets.BUNDLE_KEYSTORE_BASE64 }}
          BUNDLE_STORE_FILE: ${{ secrets.BUNDLE_STORE_FILE }}
          BUNDLE_KEY_ALIAS: ${{ secrets.BUNDLE_KEY_ALIAS }}
          BUNDLE_KEY_PASSWD: ${{ secrets.BUNDLE_KEY_PASSWD }}
          BUNDLE_STORE_PASSWD: ${{ secrets.BUNDLE_STORE_PASSWD }}

      - name: Build release APK (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: ./gradlew :app:assembleRelease --stacktrace -Porg.gradle.java.installations.paths="$JAVA_HOME_21_X64,$JAVA_HOME_25_X64"

      - name: Verify release APK signature and version (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "release APK: $APK ($(stat -c%s "$APK") bytes)"
          APKSIGNER=$(ls "$ANDROID_HOME/build-tools/"*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          # The tag and the version must agree: the versionName in
          # build.gradle.kts must equal the tag minus its leading
          # 'v', and the APK must be app.backhaul at that version and
          # code. The signed release needs an uninstall first, by
          # design — it is a new key, so it cannot install over a
          # debug build.
          AAPT=$(ls "$ANDROID_HOME/build-tools/"*/aapt2 | sort -V | tail -1)
          BADGING=$("$AAPT" dump badging "$APK" | head -1)
          echo "$BADGING"
          VERSION_NAME=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          VERSION_CODE=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts)
          TAG_NAME="${GITHUB_REF#refs/tags/v}"
          [ "$VERSION_NAME" = "$TAG_NAME" ] || {
            echo "tag $TAG_NAME != versionName $VERSION_NAME"
            exit 1
          }
          echo "$BADGING" | grep -q "name='app.backhaul' versionCode='$VERSION_CODE' versionName='$VERSION_NAME'" || {
            echo "release APK is not $VERSION_NAME / versionCode $VERSION_CODE: $BADGING"
            exit 1
          }
          echo "release APK verified: signed, app.backhaul $VERSION_NAME/code $VERSION_CODE"

      - name: Upload release APK artifact (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: backhaul-apk-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  release:
    name: Attach release APK to release
    # Tags only, and only after the build job has built the release
    # APK. The release is therefore never created from an unverified
    # build.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    # The workflow-level permissions are contents: read; this job
    # needs write to create the release and upload the asset.
    permissions:
      contents: write
    steps:
      - name: Check out source (for the release notes)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download release APK
        uses: actions/download-artifact@v4
        with:
          name: backhaul-apk-release
          path: release-apk

      - name: Create release and attach APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          APK_SRC=$(ls release-apk/*.apk)
          [ "$(ls release-apk/*.apk | wc -l)" -eq 1 ] || {
            echo "expected exactly one APK in release-apk/, found:"
            ls -l release-apk/
            exit 1
          }
          [ -s "$APK_SRC" ] || {
            echo "release APK is empty: $APK_SRC"
            exit 1
          }
          # A descriptive asset name: the raw Gradle output is
          # app-release.apk. Same bytes, so the SHA-256 is unchanged.
          APK="backhaul-$TAG.apk"
          cp "$APK_SRC" "$APK"
          SIZE=$(stat -c%s "$APK")
          SHA256=$(sha256sum "$APK" | cut -d' ' -f1)
          echo "attaching $APK ($SIZE bytes, sha256 $SHA256) to release $TAG"
          # Final notes: the repo's RELEASE_NOTES.md plus a Build
          # section carrying the exact bytes of the file being
          # attached, so the release page shows the size and
          # SHA-256.
          {
            cat RELEASE_NOTES.md
            echo ""
            echo "- Tag $TAG, commit $GITHUB_SHA; workflow run $GITHUB_RUN_ID."
            echo "- Release APK: $APK, $SIZE bytes, SHA-256: \`$SHA256\`."
          } > release-notes-final.md
          # A re-run of the tag workflow (or a release created by
          # hand) must not fail here: create only when missing —
          # refreshing the notes in either case, since the notes
          # file is the source of truth — then upload with
          # --clobber so a stale asset is replaced rather than
          # erroring.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists — refreshing its notes and uploading the asset"
            gh release edit "$TAG" --notes-file release-notes-final.md
          else
            gh release create "$TAG" --title "Backhaul $TAG" --notes-file release-notes-final.md
          fi
          gh release upload "$TAG" "$APK" --clobber
          echo "release $TAG now carries:"
          gh release view "$TAG" --json assets --jq '.assets[].name'
